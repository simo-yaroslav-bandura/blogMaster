version: "3.9"
services:
  db: # <-- имя сервиса БД (используй его как host в PHP)docker compose up -d --build
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: web-log          # сразу создаст БД
      MYSQL_ROOT_HOST: "%"             # разрешит root не только с localhost
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql


  php-apache:
    container_name: firstwebsite_php-apache_1
    build: ./php
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

volumes:
  db_data: {}